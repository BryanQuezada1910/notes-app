/notes.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteFlow - Organiza tus ideas</title>
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!--Import Google Font-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!--Import Tailwind CSS-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="font-[Poppins] bg-indigo-50/30 text-gray-800">
    <div class="min-h-screen flex flex-col">
      <!--Navbar-->
      <nav class="fixed top-0 w-full bg-white/95 backdrop-blur-md shadow-sm z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <div class="flex items-center">
              <a href="#!" class="flex items-center">
                <div class="w-2 h-6 bg-indigo-500 rounded mr-2"></div>
                <span class="font-bold text-xl text-gray-800">NoteFlow</span>
              </a>
            </div>
            
            <!-- Mobile menu button -->
            <div class="md:hidden flex items-center">
              <button id="mobile-menu-button" class="text-gray-800 hover:text-indigo-500 focus:outline-none" type="button">
                <span class="material-icons">menu</span>
              </button>
            </div>
            
            <!-- Desktop menu -->
            <div class="hidden md:flex items-center space-x-4">
              <!-- Perfil de usuario -->
              <div class="flex items-center mr-4">
                <img id="user-avatar" src="https://via.placeholder.com/32" alt="Avatar" class="w-8 h-8 rounded-full border-2 border-indigo-200 object-cover mr-2">
                <span id="user-name" class="font-medium text-gray-800">Usuario</span>
              </div>
              <a href="/auth/logout" class="inline-flex items-center px-5 py-2 rounded-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium shadow-sm hover:shadow-md transition-all duration-200 ease-in-out hover:-translate-y-0.5">
                Cerrar Sesión
              </a>
            </div>
          </div>
        </div>
      </nav>
      
      <!-- Mobile menu -->
      <div id="mobile-menu" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-black/50" id="mobile-overlay"></div>
        <div class="absolute right-0 top-0 w-64 h-full bg-white shadow-lg transform translate-x-0 transition-transform ease-in-out duration-300">
          <div class="flex justify-end p-4">
            <button id="close-mobile-menu" class="text-gray-500 hover:text-gray-700 focus:outline-none">
              <span class="material-icons">close</span>
            </button>
          </div>
          <div class="px-4 py-2">
            <!-- Perfil en móvil -->
            <div class="flex items-center mb-4 pb-4 border-b border-gray-100">
              <img id="mobile-user-avatar" src="https://via.placeholder.com/40" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-indigo-200 object-cover mr-3">
              <span id="mobile-user-name" class="font-medium text-gray-800">Usuario</span>
            </div>
            <a href="/auth/logout" class="flex items-center justify-center px-4 py-2 rounded-full bg-indigo-500 text-white font-medium shadow-sm hover:bg-indigo-600 transition-all duration-200 ease-in-out">
              Cerrar Sesión
            </a>
          </div>
        </div>
      </div>

      <!-- Modal para actualizar notas -->
      <div id="update-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
          <!-- Background overlay -->
          <div id="update-modal-backdrop" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>

          <!-- Modal panel -->
          <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
              <h3 class="text-2xl text-center font-semibold text-gray-900 mb-5">Actualizar Nota</h3>
              <div class="mt-3">
                <div class="mb-4">
                  <label for="update-title" class="block text-sm font-medium text-gray-700 mb-1">Título</label>
                  <input id="update-title" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
                <div class="mb-4">
                  <label for="update-content" class="block text-sm font-medium text-gray-700 mb-1">Contenido</label>
                  <input id="update-content" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
              </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
              <button id="update-note-btn" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-500 text-base font-medium text-white hover:bg-indigo-600 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
                Actualizar
              </button>
              <button id="update-modal-cancel" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:w-auto sm:text-sm">
                Cancelar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main content -->
      <main class="container mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-10">
        <h1 class="text-3xl md:text-4xl font-bold text-center mt-6 mb-12">
          <span class="text-indigo-500">Note</span>Flow
          <span class="material-icons align-middle text-3xl ml-2">edit_note</span>
        </h1>

        <!-- New Note Form -->
        <div class="max-w-2xl mx-auto mb-10">
          <div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-all duration-200">
            <div class="p-6">
              <form id="new-note-form">
                <div class="mb-4">
                  <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Título</label>
                  <input id="title" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
                <div class="mb-4">
                  <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Contenido</label>
                  <input id="content" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
                <div class="flex justify-end space-x-3">
                  <button id="cancel-button" type="reset" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none transition-all duration-200">
                    <span class="material-icons text-sm mr-2">close</span>
                    Cancelar
                  </button>
                  <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-500 hover:bg-indigo-600 focus:outline-none transition-all duration-200">
                    <span class="material-icons text-sm mr-2">add</span>
                    Agregar Nota
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Notes Grid -->
        <div id="notes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </main>
    </div>

    <script>
      // Inicialización del menú móvil
      document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const closeMobileMenu = document.getElementById('close-mobile-menu');
        const mobileOverlay = document.getElementById('mobile-overlay');
        
        if (mobileMenuButton) {
          mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
          });
        }
        
        if (closeMobileMenu) {
          closeMobileMenu.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
          });
        }
        
        if (mobileOverlay) {
          mobileOverlay.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
          });
        }

        // Funcionalidad del modal
        const updateModal = document.getElementById('update-modal');
        const updateModalBackdrop = document.getElementById('update-modal-backdrop');
        const updateModalCancel = document.getElementById('update-modal-cancel');
        
        if (updateModalCancel) {
          updateModalCancel.addEventListener('click', () => {
            updateModal.classList.add('hidden');
          });
        }
        
        if (updateModalBackdrop) {
          updateModalBackdrop.addEventListener('click', () => {
            updateModal.classList.add('hidden');
          });
        }
      });
    </script>
    <script type="text/javascript" src="/js/notes-page/notes.js"></script>
  </body>
</html>
